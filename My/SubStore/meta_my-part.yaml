rules:
  # tailscale
  # - DOMAIN-SUFFIX,ts.net,mihomo-node
  # - IP-CIDR6,fd7a:115c:a1e0::/48,mihomo-node,no-resolve
  # - IP-CIDR,100.64.0.0/10,mihomo-node,no-resolve
  # - IP-CIDR,192.168.1.0/24,mihomo-node,no-resolve
  
  # 自定义规则
  - RULE-SET,myDirect,DIRECT
  - RULE-SET,myReject,REJECT
  - RULE-SET,myProxy,FINAL
  
rule-providers:
  # 自定义规则
  myDirect: {type: http, interval: 86400, behavior: domain, path: ./rule_set/myDirect.list, format: text, url: 'https://ghfast.top/https://github.com/158212892/QuantumultXMark/raw/main/My/RuleSet/myDirect.list'}
  myReject: {type: http, interval: 86400, behavior: domain, path: ./rule_set/myReject.list, format: text, url: 'https://ghfast.top/https://github.com/158212892/QuantumultXMark/raw/main/My/RuleSet/myReject.list'}
  myProxy: {type: http, interval: 86400, behavior: domain, path: ./rule_set/myProxy.list, format: text, url: 'https://ghfast.top/https://github.com/158212892/QuantumultXMark/raw/main/My/RuleSet/myProxy.list'}