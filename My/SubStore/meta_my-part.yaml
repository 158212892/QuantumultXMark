

# 全局配置
mode: rule
mixed-port: 7890
udp: true
ipv6: true
allow-lan: true
# authentication: [user:password]
skip-auth-prefixes:
  - 127.0.0.1/8
  - ::1/128
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 172.23.0.0/16
  - 172.17.0.0/16
  - 172.18.0.0/16
  - 172.19.0.0/16
  - 192.168.8.0/24

# 外部控制 (API)
external-controller: 127.0.0.1:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"


tun:
  enable: false
  # stack: mips
  # loopback-address: 
  #   - 10.7.0.1

dns:
  enable: true
  ipv6: true

# proxy-providers:
#   Primary: {<<: *base-provider, url: '', override: {additional-prefix: '[P] '}}
#   # Backup:   {<<: *base-provider, url: 'YOUR_BACKUP_URL',  override: {additional-prefix: '[B] '}}


